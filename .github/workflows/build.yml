name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Test
        run: |
          uv sync --extra dev --extra build
          uv run pytest
      - name: Build portable app
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: GeminiWatermarkEraser-windows-x64
          path: dist/GeminiWatermarkEraser-windows-x64.zip

  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Test
        run: |
          uv sync --extra dev --extra build
          uv run pytest
      - name: Build personal macOS app
        run: bash packaging/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GeminiWatermarkEraser-macos-arm64
          path: dist/GeminiWatermarkEraser-macos-arm64.dmg
