name: Build desktop apps

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "release-*"
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Test
        run: |
          uv sync --extra dev --extra build
          uv run pytest
      - name: Build portable app
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - name: Verify portable artifact
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "dist/GeminiWatermarkEraser-windows-x64.zip" -PathType Leaf)) {
            throw "Windows portable ZIP was not produced."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: GeminiWatermarkEraser-windows-x64
          path: dist/GeminiWatermarkEraser-windows-x64.zip
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Test
        run: |
          uv sync --extra dev --extra build
          uv run pytest
      - name: Verify runner architecture
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Build macOS DMG
        run: bash packaging/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GeminiWatermarkEraser-macos-${{ matrix.arch }}
          path: dist/GeminiWatermarkEraser-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if (( ${#assets[@]} == 0 )); then
            echo "No desktop artifacts were downloaded." >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Gemini Watermark Eraser ${GITHUB_REF_NAME}" \
            --generate-notes
